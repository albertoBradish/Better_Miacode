name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v*-better.*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/package.yml
    with:
      channel: release
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Verify all platform reports and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          python scripts/build/verify-release.py --verify-reports release-artifacts
          gh release create "$RELEASE_TAG" release-artifacts/*.7z release-artifacts/*.sha256 release-artifacts/*verification.json \
            --verify-tag --title "Better Miacode ${RELEASE_TAG#v}" --notes-file docs/releases/better_4.md
